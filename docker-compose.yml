version: '3.8'

services:
  # Python 版本授权服务器
  ycp-auth-python:
    build:
      context: ./server_python
      dockerfile: Dockerfile
    container_name: ycp-auth-python
    ports:
      - "13337:13337"
    volumes:
      - ./data/ycp_auth.db:/app/ycp_auth.db
    restart: unless-stopped
    environment:
      - FLASK_ENV=production

  # Go 版本授权服务器（高性能）
  ycp-auth-go:
    build:
      context: ./server_go
      dockerfile: Dockerfile
    container_name: ycp-auth-go
    ports:
      - "13338:13337"  # 使用不同端口避免冲突
    volumes:
      - ./data/ycp_auth_go.db:/app/ycp_auth.db
    restart: unless-stopped

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: ycp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - ycp-auth-python
    restart: unless-stopped

volumes:
  data:
    driver: local
